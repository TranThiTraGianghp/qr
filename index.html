<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng...</title>

  <!-- CẤU HÌNH LINK ĐÍCH TẠI ĐÂY: Khi cần đổi link trong tương lai, chỉ cần sửa link này -->
  <script>
    const DESTINATION_URL = "https://seagu-org.github.io/dubaomua/";
    
    // Tự động chuyển hướng ngay lập tức bằng Javascript
    window.location.replace(DESTINATION_URL);
  </script>

  <!-- Fallback nếu trình duyệt tắt JavaScript -->
  <meta http-equiv="refresh" content="0; url=https://seagu-org.github.io/dubaomua/">
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Đang chuyển hướng đến trang thông tin...</p>
  <p style="font-size: 14px; color: #64748b;">
    Nếu trình duyệt không tự chuyển, <a id="manual-link" href="https://seagu-org.github.io/dubaomua/">nhấp vào đây</a>.
  </p>
  <script>
    document.getElementById('manual-link').href = DESTINATION_URL;
  </script>
</body>
</html>
